version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Raise pull requests for version updates
    target-branch: "git-leaks-code"
    # Number of pull requests to open simultaneously
    open-pull-requests-limit: 10
    # Labels on pull requests for version updates
    labels:
      - "dependencies"
      - "python"
    # Assignees for pull requests
    # assignees:
    #   - "your-username"
    # Reviewers for pull requests
    # reviewers:
    #   - "your-username"

  # Optional: Add GitHub Actions workflow dependencies scanning
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

